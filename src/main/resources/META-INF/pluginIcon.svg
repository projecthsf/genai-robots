<svg width="40" height="40" viewBox="0 0 40 40" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4C8DF6"/>
      <stop offset="1" stop-color="#2F6BDA"/>
    </linearGradient>
  </defs>
  <!-- antenna -->
  <line x1="20" y1="4" x2="20" y2="10" stroke="#2F6BDA" stroke-width="2" stroke-linecap="round"/>
  <circle cx="20" cy="4" r="2.4" fill="#4C8DF6"/>
  <!-- head -->
  <rect x="7" y="10" width="26" height="21" rx="6" fill="url(#g)"/>
  <!-- eyes -->
  <circle cx="15" cy="20.5" r="3" fill="#FFFFFF"/>
  <circle cx="25" cy="20.5" r="3" fill="#FFFFFF"/>
  <circle cx="15" cy="20.5" r="1.3" fill="#2A2F3A"/>
  <circle cx="25" cy="20.5" r="1.3" fill="#2A2F3A"/>
  <!-- mouth grille -->
  <rect x="14" y="26" width="12" height="2.2" rx="1.1" fill="#DCE8FF"/>
  <!-- ears -->
  <rect x="4.5" y="17" width="2.5" height="7" rx="1.25" fill="#2F6BDA"/>
  <rect x="33" y="17" width="2.5" height="7" rx="1.25" fill="#2F6BDA"/>
</svg>
